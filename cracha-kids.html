<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Crachá Kids | Vidas Renovadas Gestão</title>

  <meta
    name="theme-color"
    content="#071f3b"
  >

  <link
    rel="icon"
    type="image/png"
    href="logo.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eef3f7;
      color: #082f49;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    .pagina-cracha-kids {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 50px;
    }

    .barra-superior {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .rotulo-superior {
      margin: 0 0 5px;
      color: #b27a00;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .barra-superior h1 {
      margin: 0;
      color: #082f49;
      font-size: 28px;
      font-weight: 900;
    }

    .acoes-superiores {
      display: flex;
      gap: 10px;
    }

    .botao {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border: 1px solid #cad6df;
      border-radius: 10px;
      background: #ffffff;
      color: #082f49;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    .botao-principal {
      border-color: #082f49;
      background: #082f49;
      color: #ffffff;
    }

    .mensagem-estado {
      margin-bottom: 20px;
      padding: 14px 16px;
      border: 1px solid #cad6df;
      border-radius: 12px;
      background: #ffffff;
      color: #607483;
      font-size: 13px;
    }

    .mensagem-estado.erro {
      border-color: #e9b9b5;
      background: #fcebea;
      color: #a92a22;
    }

    /*
      A visualização na tela é ampliada.
      Na impressão cada crachá terá exatamente
      9 cm de largura por 7 cm de altura.
    */
    .area-crachas {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 540px));
      justify-content: center;
      align-items: start;
      gap: 25px;
    }

    .cracha-kids {
      position: relative;

      width: 540px;
      aspect-ratio: 9 / 7;

      overflow: hidden;

      border-radius: 20px;
      background: #ffffff;

      box-shadow:
        0 18px 42px
        rgba(7, 31, 59, 0.16);
    }

    .arte-cracha {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: fill;

      pointer-events: none;
      user-select: none;
    }

    /* ======================================================
       FRENTE
    ====================================================== */

    .foto-area {
      position: absolute;

      /*
        Área branca da foto existente
        na própria arte aprovada.
      */
      top: 11.1%;
      left: 7.7%;

      width: 35.5%;
      height: 50.3%;

      overflow: hidden;

      border-radius: 8px;

      z-index: 5;
    }

    .foto-kid,
    .foto-placeholder {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;
    }

    .foto-kid {
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .foto-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;

      background: #edf0f2;
      color: #113d6d;

      font-size: 34px;
      font-weight: 900;
    }

    .foto-placeholder[hidden],
    .foto-kid[hidden] {
      display: none !important;
    }

    /*
      O nome original "NOME DA CRIANÇA"
      já faz parte da arte aprovada.
      Esta faixa cobre apenas a área interna
      do banner e recebe o nome verdadeiro.
    */
    .nome-dinamico {
  position: absolute;

  left: 21%;
  bottom: 20.5%;

  width: 55%;
  height: 14%;
  min-height: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0 8px;

  background: transparent;

  color: #ffc43b;

  text-align: center;

  z-index: 6;
}

    .nome-dinamico strong {
      display: block;

      max-width: 100%;

      font-family:
        "Trebuchet MS",
        Arial,
        sans-serif;

      font-size: 20px;
      font-weight: 900;
      line-height: 1.05;

      text-transform: uppercase;

      white-space: normal;
      overflow-wrap: normal;
    }

    /* ======================================================
       VERSO
    ====================================================== */

    .dado-verso {
  position: absolute;

  left: 14.8%;

  width: 38%;
  height: 5.8%;

  display: flex;
  align-items: center;

  padding: 0;

  background: transparent;

  font-size: 16px;
  font-weight: 900;

  z-index: 6;
    }

    .dado-mae {
  top: 31%;
  color: #0a8783;
}

.dado-pai {
  top: 49%;
  color: #082f67;
}

.dado-telefone {
  top: 67%;
  color: #f15e4b;
}

    .dado-verso strong {
  display: block;
  width: 100%;
  max-width: 100%;

  line-height: 1 !important;

  white-space: nowrap !important;
  overflow-wrap: normal !important;
  word-break: normal !important;

  overflow: visible;
}

    /*
      O JS atual ainda tenta preencher
      responsavelKidCracha.
      Mantemos o elemento escondido para
      não quebrar o código, pois esse campo
      não faz parte do modelo aprovado.
    */
    #responsavelKidCracha {
      display: none !important;
    }

    /* ======================================================
       RESPONSIVIDADE
    ====================================================== */

    @media (max-width: 1160px) {
      .area-crachas {
        grid-template-columns: 1fr;
        justify-items: center;
      }
    }

    @media (max-width: 600px) {
      .pagina-cracha-kids {
        width: min(100% - 18px, 560px);
        padding-top: 18px;
      }

      .barra-superior {
        flex-direction: column;
        align-items: stretch;
      }

      .acoes-superiores {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .cracha-kids {
        width: 100%;
        max-width: 540px;
      }

      .nome-dinamico strong {
        font-size: clamp(
          12px,
          4vw,
          22px
        );
      }

      .dado-verso {
        font-size: clamp(
          10px,
          3.3vw,
          18px
        );
      }
    }

    /* ======================================================
       IMPRESSÃO — 9 x 7 CM
    ====================================================== */

    @page {
      size: A4 portrait;
      margin: 12mm;
    }

    @media print {
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }

      .pagina-cracha-kids {
        width: auto;
        margin: 0;
        padding: 0;
      }

      .barra-superior,
      .mensagem-estado {
        display: none !important;
      }

      .area-crachas {
        display: flex;
        flex-direction: column;

        align-items: center;
        justify-content: flex-start;

        gap: 10mm;

        margin: 0;
        padding: 0;
      }

      .cracha-kids {
        width: 9cm !important;
        height: 7cm !important;

        aspect-ratio: auto;

        border-radius: 3mm;

        box-shadow: none;

        break-inside: avoid;
        page-break-inside: avoid;

        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
    }
  </style>
</head>

<body>

  <main class="pagina-cracha-kids">

    <header class="barra-superior">

      <div>

        <p class="rotulo-superior">
          Ministério Kids
        </p>

        <h1>
          Crachá Kids
        </h1>

      </div>


      <div class="acoes-superiores">

        <a
          id="botaoVoltar"
          class="botao"
          href="kids.html"
        >
          ← Voltar
        </a>

        <button
          id="botaoImprimir"
          class="botao botao-principal"
          type="button"
        >
          Imprimir crachá
        </button>

      </div>

    </header>


    <section
      id="mensagemCrachaKids"
      class="mensagem-estado"
    >
      Carregando Crachá Kids...
    </section>


    <section
      id="areaCrachaKids"
      class="area-crachas"
      hidden
    >

      <!-- ==========================================
           FRENTE — MODELO APROVADO
      =========================================== -->

      <article
        class="cracha-kids"
        aria-label="Frente do Crachá Kids"
      >

        <img
          class="arte-cracha"
          src="img/kids/cracha-kids-frente-aprovado-9x7.png?v=2"
          alt=""
        >


        <div class="foto-area">

          <img
            id="fotoKidCracha"
            class="foto-kid"
            alt="Foto da criança"
            hidden
          >

          <div
            id="fotoPlaceholderCracha"
            class="foto-placeholder"
          >
            KIDS
          </div>

        </div>


        <div class="nome-dinamico">

          <strong id="nomeKidCracha">
            NOME DA CRIANÇA
          </strong>

        </div>

      </article>


      <!-- ==========================================
           VERSO — MODELO APROVADO
      =========================================== -->

      <article
        class="cracha-kids"
        aria-label="Verso do Crachá Kids"
      >

        <img
          class="arte-cracha"
          src="img/kids/cracha-kids-verso-aprovado-9x7.png"
          alt=""
        >


        <div
          class="dado-verso dado-mae"
        >
          <strong id="maeKidCracha">
            —
          </strong>
        </div>


        <div
          class="dado-verso dado-pai"
        >
          <strong id="paiKidCracha">
            —
          </strong>
        </div>


        <div
          class="dado-verso dado-telefone"
        >
          <strong id="telefoneKidCracha">
            —
          </strong>
        </div>


        <strong id="responsavelKidCracha">
          —
        </strong>

      </article>

    </section>

  </main>


  <script src="js/configuracoes.js?v=2"></script>
  <script src="js/api.js?v=2"></script>
  <script src="js/auth.js?v=5"></script>

  <script src="js/cracha-kids.js?v=8"></script>

</body>

</html>
