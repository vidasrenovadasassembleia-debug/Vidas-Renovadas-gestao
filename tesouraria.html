<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel da Tesouraria | Vidas Renovadas Gestão</title>

    <link rel="stylesheet" href="css/estilo.css?v=50">
    <link rel="stylesheet" href="css/financeiro.css?v=1">

</head>

<body class="tesouraria-page">
<div class="tesouraria-container">

    <header class="tesouraria-topo">

        <div class="tesouraria-logo-area">

            <img
                src="imagens/logo.png"
                alt="Assembleia de Deus Ministério Vidas Renovadas"
                class="tesouraria-logo"
            >

            <h1>ASSEMBLEIA DE DEUS MINISTÉRIO VIDAS RENOVADAS</h1>

            <h2>Painel da Tesouraria</h2>

            <p>Lançamento de Dízimos e Ofertas</p>

        </div>

        <div class="tesouraria-usuario">

            <span id="usuarioLogado">
                Usuário
            </span>

            <button
                type="button"
                class="btn btn-contorno"
                id="btnSair">

                Sair

            </button>

        </div>

    </header>

    <main class="tesouraria-conteudo">
<form id="formTesouraria" class="formulario-padrao" autocomplete="off">

    <section class="painel">

        <div class="painel-cabecalho">
            <h3 class="painel-titulo">
                Informações do Culto
            </h3>
        </div>

        <div class="painel-corpo formulario-grid">

            <div class="campo">
                <label for="dataCulto">Data</label>
                <input
                    type="date"
                    id="dataCulto"
                    name="dataCulto"
                    required>
            </div>

            <div class="campo">
                <label for="congregacao">Congregação</label>

                <select
                    id="congregacao"
                    name="congregacao"
                    required>

                    <option value="">
                        Selecione...
                    </option>

                </select>
            </div>

            <div class="campo">
                <label for="responsavel">Responsável</label>

                <input
                    type="text"
                    id="responsavel"
                    name="responsavel"
                    readonly>
            </div>

        </div>

    </section>

</form>
    </main>

</div>
</body>

</html>
