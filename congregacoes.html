<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Congregações | Vidas Renovadas Gestão</title>

  <meta
    name="description"
    content="Cadastro, consulta e gerenciamento das congregações."

  <meta name="theme-color" content="#071f3b">

  <link rel="icon" type="image/png" href="logo.png">

  <link

  >

  <link

<body

    <div id="layoutSidebar"></div>
