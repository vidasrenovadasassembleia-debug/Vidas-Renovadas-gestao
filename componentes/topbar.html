<header class="topbar">

  <div class="topbar-esquerda">

    <button
      type="button"
      class="botao-menu-mobile"
      data-acao="alternar-menu"
      aria-label="Abrir menu"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      ☰
    </button>

    <div class="topbar-identidade-pagina">
      <h1
        class="topbar-titulo"
        data-layout-titulo
      >
        Página
      </h1>

      <p
        class="topbar-subtitulo"
        data-layout-subtitulo
      >
        Carregando informações...
      </p>
    </div>

  </div>

  <div class="topbar-direita">

    <div
      class="topbar-data"
      aria-label="Data e hora atuais"
    >
      <strong id="dataAtual">—</strong>
      <br>
      <span id="horaAtual">—</span>
    </div>

    <div class="topbar-usuario">

      <div
        class="topbar-avatar"
        data-usuario-iniciais
        aria-hidden="true"
      >
        VR
      </div>

      <div class="topbar-usuario-dados">
        <span
          class="topbar-usuario-nome"
          data-usuario-nome
        >
          Usuário
        </span>

        <span
          class="topbar-usuario-cargo"
          data-usuario-cargo
        >
          Carregando perfil...
        </span>
      </div>

    </div>

  </div>

</header>
